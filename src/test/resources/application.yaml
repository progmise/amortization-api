spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:amortization;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

redis:
  host: localhost
  port: 6379
  password:
  ssl: false
  schedule:
    name: "schedules"
    ttl:
      seconds: 300

server:
  servlet:
    context-path: "/api/1.0"
